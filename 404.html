<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>ККМП: ОШИБКА СИСТЕМЫ</title>

    <!-- Dynamic path detection for GitHub Pages vs Local -->
    <script>
        // Check if we are in the repository folder (GitHub Pages or local subfolder)
        const pathPrefix = window.location.pathname.startsWith('/scmtwo-guide') ? '/scmtwo-guide' : '';

        document.write(`<link rel="icon" href="${pathPrefix}/favicon.svg" type="image/svg+xml">`);
        document.write(`<link rel="stylesheet" href="${pathPrefix}/css/style.css">`);
    </script>

    <!-- Fallback/Critical CSS for 404 page ensuring it looks right even if path fails -->

</head>

<body class="error-page-body">

    <div class="scanline"></div>

    <div class="terminal-error-container">
        <div class="error-code">404</div>
        <div class="error-message">СИГНАЛ ПОТЕРЯН // СОЕДИНЕНИЕ РАЗОРВАНО</div>

        <div class="terminal-text">USCM_NETWORK_LOG: <span style="color: #f85149">КРИТИЧЕСКАЯ ОШИБКА</span> ПО АДРЕСУ
            0x404</div>
        <div class="terminal-text">ЦЕЛЬ_ДАННЫЕ: НЕ_НАЙДЕНО</div>
        <div class="terminal-text">ТРАССИРОВКА: СБОЙ</div>
        <div class="terminal-text">СТАТУС: ПОТЕРЯ ПАКЕТА</div>

        <br>
        <div class="terminal-text">> Инициализация аварийных протоколов...</div>
        <div class="terminal-text">> Перенаправление в командный центр...</div>

        <div class="error-actions">
            <!-- Dynamic Home Link -->
            <a href="/" id="home-btn" class="btn-terminal">ПЕРЕЗАГРУЗКА (ГЛАВНАЯ)</a>
            <a href="javascript:history.back()" class="btn-terminal danger">ОТМЕНА ОПЕРАЦИИ (НАЗАД)</a>
        </div>
    </div>

    <script>
        // Update Home button link based on environment
        // Uses the same logic as the head script
        const prefix = window.location.pathname.startsWith('/scmtwo-guide') ? '/scmtwo-guide/' : '/';
        document.getElementById('home-btn').href = prefix;
    </script>
    </div>

</body>

</html>
